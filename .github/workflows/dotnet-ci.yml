
      - name: Generate NuGet Package
        shell: pwsh
        run: |
          dotnet pack MyLogger/MyLogger.csproj `
            --configuration Release `
            --output "${{ github.workspace }}\packages" `
            -p:Version=1.0.${{ github.run_number }}

      - name: Verify NuGet Package
        shell: pwsh
        run: |
          $packages = Get-ChildItem "${{ github.workspace }}\packages" -Filter "*.nupkg"

          if (-not $packages) {
              throw "No NuGet package was generated!"
          }

          $packages | ForEach-Object {
              Write-Host "Package found: $($_.FullName)"
          }

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = Get-ChildItem "${{ github.workspace }}\packages" -Filter "*.nupkg"

          foreach ($package in $packages) {
              Write-Host "Publishing $($package.Name)"

              dotnet nuget push $package.FullName `
                --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
                --api-key $env:GITHUB_TOKEN `
                --skip-duplicate

              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }
